<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Clock</title>
    <style>
        body {
            font-family: "Courier Twelve Mt Std", Courier, monospace;
            background-color: #1a1a1a; /* Very dark grey background */
            color: white; /* White text */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .clock {
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="clock" id="clock"></div>

    <script>
        // Set the specific date: 13th December 2024
        const startDate = new Date("2024-12-13T00:00:00");

        function updateClock() {
            const now = new Date();
            const timeDifference = now - startDate;

            // Calculate the total number of hours since the start date
            const totalHoursElapsed = Math.floor(timeDifference / (1000 * 60 * 60));

            // Calculate the cycle hour (1st, 2nd, etc., up to 13th Hour)
            const cycleHour = (totalHoursElapsed % 13) + 1; // Ensures 1 to 13 hour cycle

            // Determine the appropriate suffix for the cycle hour (1st, 2nd, 3rd, etc.)
            let suffix = "th";
            if (cycleHour === 1) suffix = "st";
            else if (cycleHour === 2) suffix = "nd";
            else if (cycleHour === 3) suffix = "rd";

            // Get the current time for AM/PM format
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            const currentSecond = now.getSeconds();

            // Format the time as 12-hour format (AM/PM)
            let hoursIn12 = currentHour % 12;
            if (hoursIn12 === 0) hoursIn12 = 12; // Adjust midnight/noon to 12
            const ampm = currentHour >= 12 ? 'PM' : 'AM';

            // Update the clock text
            const clockElement = document.getElementById("clock");
            clockElement.innerText = `Time aboard the Eye Engine: ${hoursIn12.toString().padStart(2, '0')}:${currentMinute.toString().padStart(2, '0')}:${currentSecond.toString().padStart(2, '0')} ${ampm} (${cycleHour}${suffix} Hour)`;
        }

        // Update the clock every second
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
