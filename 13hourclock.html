<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock Example</title>
    <style>
        /* Define the custom Courier 12 font using @font-face */
        @font-face {
            font-family: "Courier12";
            src: url("Courier12-Regular.ttf") format("truetype"); /* Adjust the path if necessary */
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'Courier12', monospace; /* Apply Courier12 font */
            margin: 0;
            padding: 0;
            background-color: #121212;
        }

        /* Styling for the clock container */
        .clock-display {
            position: fixed;
            top: 10px;
            right: 10px;
            font-family: 'Courier12', monospace;  /* Apply Courier12 font */
            text-align: right;
            color: white;
            text-shadow: 1px 1px 2px black;
        }

        /* Styling for the label */
        .time-container {
            font-size: 18px;  /* Slightly smaller font size for the label */
            color: #AAAAAA;
            margin-bottom: 5px;
        }

        /* Styling for the actual time */
        #time {
            font-size: 24px;  /* Font size for the time */
        }
    </style>
</head>
<body>
    <div class="clock-display" id="clock">
        <div class="time-container">Time aboard the Eye Engine:</div>
        <div id="time"></div>
    </div>

    <script>
        // Define the starting date as a constant
        const START_DATE = new Date(2024, 11, 13); // December 13, 2024

        // Function to calculate and return the elapsed time string
        function getElapsedTime() {
            const now = new Date();
            const elapsed = now - START_DATE;

            // Total elapsed seconds
            const total_seconds = Math.floor(elapsed / 1000);

            // Total hours passed
            const total_hours = Math.floor(total_seconds / 3600);

            // Calculate the 13-hour clock (13:00 AM = 1st hour, 1:00 AM = 2nd hour)
            let hours_13 = (total_hours % 13);
            if (hours_13 === 0) {
                hours_13 = 13;  // Adjust so 0 becomes 13
            }

            // Map 13-hour clock to the 26-hour clock starting at "1st hour"
            const hours_26 = ((total_hours + 13) % 26) + 1; // Offset by 13 for alignment

            // Minutes and seconds
            const minutes = Math.floor(total_seconds % 3600 / 60);
            const seconds = total_seconds % 60;

            // Correct AM/PM determination for the 13-hour clock
            // Swap AM/PM
            const period = hours_26 <= 13 ? "PM" : "AM";

            // Determine the suffix for the 26-hour clock
            let suffix = "th";
            if (hours_26 % 10 === 1 && hours_26 !== 11) {
                suffix = "st";
            } else if (hours_26 % 10 === 2 && hours_26 !== 12) {
                suffix = "nd";
            } else if (hours_26 % 10 === 3 && hours_26 !== 13) {
                suffix = "rd";
            }

            // Format the time string for the 13-hour clock with the 26-hour suffix
            return `${hours_13.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')} ${period} (${hours_26}${suffix} Hour)`;
        }

        // Function to update the clock display every second
        function updateClock() {
            const timeElement = document.getElementById('time');
            timeElement.textContent = getElapsedTime();
        }

        // Update the clock immediately, then every second
        updateClock();
        setInterval(updateClock, 1000); // Update every 1000 milliseconds (1 second)
    </script>
</body>
</html>
